<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Deep Thought after bluecornflowerlin's fan art: huge head, full-width slit mouth,
       dot eye past its right end, two bent legs bracing, rounded body between -->
  <rect width="64" height="64" rx="12" fill="#ffb81c"/>
  <!-- huge head: trapezoid, wider at top, slight flare -->
  <path d="M12 4 L52 4 L49 30 Q48.5 33 44 33.5 L20 33.5 Q15.5 33 15 30 Z" fill="#141414"/>
  <!-- mouth: long thin slit across the lower face, rising slightly to the right -->
  <path d="M17 27.5 L42 24.5" stroke="#ffb81c" stroke-width="1.4" stroke-linecap="butt"/>
  <!-- eye: small dot just past the mouth's right end, slightly above the line -->
  <circle cx="45.5" cy="22.5" r="1.9" fill="#ffb81c"/>
  <!-- left bent leg: from under head, elbow out, down to base -->
  <path d="M22 33 L16 40 L17 46 L20.5 46 L20 41 L26.5 34.5 Z" fill="#141414"/>
  <!-- right bent leg -->
  <path d="M42 33 L48 40 L47 46 L43.5 46 L44 41 L37.5 34.5 Z" fill="#141414"/>
  <!-- rounded body between the legs -->
  <path d="M24 46 Q24.5 38 32 37.5 Q39.5 38 40 46 Z" fill="#141414"/>
  <!-- the Answer -->
  <text x="32" y="60" font-family="Arial Black, Arial, sans-serif" font-size="15" font-weight="900"
        fill="#141414" text-anchor="middle">42</text>
</svg>
