<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Deep Thought: minimalist tribute — monolithic head, glowing eyes, the Answer -->
  <rect width="64" height="64" rx="12" fill="#0f172a"/>
  <!-- head silhouette: tall rounded monolith -->
  <path d="M18 54 L18 22 Q18 10 32 10 Q46 10 46 22 L46 54 Z" fill="#1d4ed8"/>
  <!-- brow ridge -->
  <path d="M22 26 Q32 22 42 26" stroke="#93c5fd" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="26" cy="32" r="3" fill="#fbbf24"/>
  <circle cx="38" cy="32" r="3" fill="#fbbf24"/>
  <!-- the Answer -->
  <text x="32" y="52" font-family="Georgia, serif" font-size="14" font-weight="bold"
        fill="#ffffff" text-anchor="middle">42</text>
</svg>
